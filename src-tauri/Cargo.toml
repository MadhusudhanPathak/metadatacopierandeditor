[package]
name = "mce"
version = "0.1.0"
description = "Copy and edit photo and video metadata, offline."
authors = ["Metadata Copier and Editor contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MadhusudhanPathak/metadatacopierandeditor"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "mce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
sha2 = "0.10"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[dev-dependencies]
tempfile = "3"

# Size-first release profile: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
